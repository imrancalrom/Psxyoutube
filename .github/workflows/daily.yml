# Daily fetch + analyze + report.
#
# The database lives on the `data` branch, with the latest report.html, psx_buzz.csv, psx_sectors.csv and digest.md.
# Each run restores it, adds new videos, and replaces that branch with a single fresh commit: the database
# already holds the full history, so keeping one commit per day would only bloat the repository with old copies.
#
# Setup: commit a channels.txt (see channels.example.txt). Optional:
#   secret   YOUTUBE_API_KEY      full upload history instead of the latest ~15 videos per channel
#   variable FETCH_TRANSCRIPTS    "true" to read captions (YouTube often blocks these from cloud runners)
#   secrets  TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID   send the daily digest to Telegram (see README)
#   Settings → Pages → Source: GitHub Actions          publish the dashboard at https://<owner>.github.io/<repo>/
name: Daily PSX YouTube run

on:
  schedule:
    - cron: "17 16 * * *"  # 21:17 Pakistan time, after the evening market videos are up
  workflow_dispatch:
    inputs:
      transcripts:
        description: Also fetch captions
        type: boolean
        default: false
      retry_captions:
        description: Retry videos earlier marked as having no captions (needs captions on)
        type: boolean
        default: false
      find_telegram_chat:
        description: Print the chat ids that messaged your Telegram bot (to fill in the TELEGRAM_CHAT_ID secret)
        type: boolean
        default: false
      probe_prices:
        description: Only print what the price sources (PSX portal, Yahoo Finance) return for OGDC and ATRL (diagnostic; no data saved)
        type: boolean
        default: false

permissions:
  contents: write
  pages: write     # publish the dashboard on GitHub Pages (when it is turned on)
  id-token: write  # required by actions/deploy-pages

concurrency:
  group: psx-yt-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pages_url: ${{ steps.pages.outputs.url }}
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Find Telegram chat id
        if: ${{ inputs.find_telegram_chat }}
        run: python -m psx_yt --db probe.db notify --find-chat

      - name: Probe PSX price endpoints (diagnostic)
        if: ${{ inputs.probe_prices }}
        run: |
          python -m psx_yt --db probe.db prices --probe OGDC
          python -m psx_yt --db probe.db prices --probe ATRL

      - name: Restore database from the data branch
        if: ${{ !inputs.probe_prices }}  # a probe run only prints the diagnostic
        run: |
          mkdir -p out
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:psx_yt.db > out/psx_yt.db
            echo "DATA_BASE=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
            echo "Restored $(du -h out/psx_yt.db | cut -f1) database"
          else
            echo "No data branch yet: starting a new database"
          fi

      - name: Add channels from channels.txt
        if: ${{ !inputs.probe_prices }}  # a probe run only prints the diagnostic
        run: |
          if [ ! -f channels.txt ]; then
            echo "::error::No channels.txt in the repository. Copy channels.example.txt, list your channels and commit it."
            exit 1
          fi
          python -m psx_yt --db out/psx_yt.db add-channel --file channels.txt

      - name: Fetch, analyze and report
        if: ${{ !inputs.probe_prices }}  # a probe run only prints the diagnostic
        run: |
          set -o pipefail  # so a failing run isn't hidden by tee
          flags=""
          if [ "${{ inputs.transcripts }}" = "true" ] || [ "${{ vars.FETCH_TRANSCRIPTS }}" = "true" ]; then
            flags="--transcripts"
            if [ "${{ inputs.retry_captions }}" = "true" ]; then
              flags="$flags --retry-captions"
            fi
          fi
          python -m psx_yt --db out/psx_yt.db run $flags -o out/report.html | tee out/summary.txt
          python -m psx_yt --db out/psx_yt.db export -o out/psx_buzz.csv
          python -m psx_yt --db out/psx_yt.db export --sectors -o out/psx_sectors.csv
          python -m psx_yt --db out/psx_yt.db digest -o out/digest.md
          { cat out/digest.md; echo; echo '```'; cat out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.probe_prices }}  # a probe run only prints the diagnostic
        with:
          name: psx-yt-report
          path: |
            out/report.html
            out/psx_buzz.csv
            out/psx_sectors.csv
            out/digest.md
          retention-days: 30

      - name: Check whether GitHub Pages is on
        id: pages
        if: ${{ !inputs.probe_prices }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null) && [ -n "$url" ]; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "Publishing the dashboard to $url"
          else
            echo "::notice::GitHub Pages is off, so the dashboard is only in this run's artifacts. To get a fixed link, turn it on: Settings → Pages → Source: GitHub Actions."
          fi

      - name: Prepare the dashboard site
        if: ${{ steps.pages.outputs.url != '' }}
        run: |
          mkdir -p site
          cp out/report.html site/index.html
          cp out/psx_buzz.csv out/psx_sectors.csv out/digest.md site/

      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.pages.outputs.url != '' }}
        with:
          path: site

      - name: Send the digest to Telegram
        # Runs before the save step, which swaps the checkout for the data branch. A Telegram problem marks this
        # step failed but doesn't stop the data from being saved.
        if: ${{ !inputs.probe_prices && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.url }}
        run: |
          if [ -n "$PAGES_URL" ]; then
            python -m psx_yt --db out/psx_yt.db notify --link "$PAGES_URL" --link-text "Open the dashboard"
          else
            python -m psx_yt --db out/psx_yt.db notify --link "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Save database to the data branch
        if: ${{ !inputs.probe_prices }}  # a probe run only prints the diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch --orphan data-new
          mv out/psx_yt.db out/report.html out/psx_buzz.csv out/psx_sectors.csv out/digest.md .
          git add -f psx_yt.db report.html psx_buzz.csv psx_sectors.csv digest.md
          git commit -q -m "Data as of $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Only replace the data we started from: if scripts/local_captions.py pushed meanwhile, fail rather than
          # drop its captions (the next run starts from them). An empty DATA_BASE means "data must not exist yet".
          git push --force-with-lease="refs/heads/data:${DATA_BASE:-}" origin data-new:data

  # Publishes the dashboard prepared above; skipped while GitHub Pages is off.
  publish:
    needs: run
    if: ${{ needs.run.outputs.pages_url != '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
